# Publishes the website (site/dist) to GitHub Pages whenever it changes on main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The pages are built locally (python site/build.py) and committed, so this only uploads them.
name: Publish website

on:
  push:
    branches: [main]
    paths: ['site/dist/**', '.github/workflows/pages.yml']
  # run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; let a running one finish
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
