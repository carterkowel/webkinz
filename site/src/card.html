<!doctype html>
<!-- The 1200 x 630 link-preview image (build.py saves it as dist/card.png). Original art only: no Webkinz images. -->
<html lang="en"><head><meta charset="utf-8"><title>Share card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito+Sans:opsz,wght@6..12,700;6..12,800&display=block">
<style>
  html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
  body { background:radial-gradient(circle at 85% 10%, #2a2340 0, #15131c 55%); color:#f0edf6; font-family:'Nunito Sans',system-ui,sans-serif;
    display:grid; align-content:center; gap:34px; padding:0 84px; box-sizing:border-box; }
  .chips { display:flex; gap:14px; }
  .chip { width:58px; height:58px; border-radius:50%; display:grid; place-items:center; font:600 26px 'Fredoka',sans-serif; color:#fff; }
  h1 { margin:0; font:600 92px/1.02 'Fredoka',sans-serif; letter-spacing:-.5px; }
  h1 span { color:#b39af0; }
  .stats { display:flex; gap:22px; }
  .stat { background:#1e1b27; border:2px solid #322e3f; border-radius:20px; padding:18px 24px; min-width:200px; }
  .stat b { display:block; font:600 50px/1.1 'Fredoka',sans-serif; color:#b39af0; }
  .stat span { font-size:21px; color:#c4bfd2; }
  .foot { font-size:23px; color:#c4bfd2; }
  .foot b { color:#f0edf6; }
</style></head>
<body>
  <div class="chips"><span class="chip" style="background:#7b52d6">M</span><span class="chip" style="background:#7b52d6">M</span><span class="chip" style="background:#4b9a39">P</span><span class="chip" style="background:#d8433b">J</span><span class="chip" style="background:#d99a0b">S</span></div>
  <h1>Jumbleberry Fields, <span>solved</span></h1>
  <div class="stats">
    <div class="stat"><b>121.8</b><span>perfect play average</span></div>
    <div class="stat"><b>58%</b><span>best chance of 121+</span></div>
    <div class="stat"><b>11%</b><span>best chance of 141+</span></div>
  </div>
  <div class="foot"><b>Live phone helper · cheat sheet · free practice game.</b> Unofficial fan project.</div>
</body></html>
